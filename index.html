<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuned Tales – Drag & Tuning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar"><span id="logo">TUNED TALES</span><span id="carname"></span><span id="cash"></span></header>
  <div id="stage">
    <canvas id="scene" width="960" height="540"></canvas>
    <nav id="menu">
      <button class="btn big" data-act="go" data-v="races">🏁 COURSES</button>
      <button class="btn big" data-act="go" data-v="tuning">📈 TUNING</button>
      <button class="btn big" data-act="go" data-v="garage">🔧 GARAGE</button>
      <button class="btn big" data-act="go" data-v="shop">🚗 CONCESSION</button>
    </nav>
    <div id="racebtns" class="hidden">
      <button id="nitrobtn" class="btn nitro">NITRO</button>
      <button class="btn small off" data-act="quitrace" style="pointer-events:auto">✖ QUITTER</button>
    </div>
    <div id="result" class="hidden"></div>
  </div>
  <section id="panel" class="hidden"></section>
</div>
<script src="js/data.js"></script>
<script src="js/physics.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/race.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
