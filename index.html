<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuned Tales – Drag & Tuning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar"><span id="logo">TUNED<i>TALES</i></span><span id="carname"></span><span id="cash"></span></header>
  <div id="stage">
    <canvas id="scene" width="960" height="540"></canvas>
    <nav id="menu">
      <button class="mi" data-act="go" data-v="races"><span class="ico">🏁</span><span class="txt"><b>COURSES</b><small>Drag 402 m · gagne du cash</small></span></button>
      <button class="mi" data-act="go" data-v="tuning"><span class="ico">📈</span><span class="txt"><b>TUNING</b><small>Pièces, courbes & gains</small></span></button>
      <button class="mi" data-act="go" data-v="garage"><span class="ico">🔧</span><span class="txt"><b>GARAGE</b><small>Tes voitures · swap moteur</small></span></button>
      <button class="mi" data-act="go" data-v="shop"><span class="ico">🚗</span><span class="txt"><b>CONCESSION</b><small>Achète une nouvelle caisse</small></span></button>
    </nav>
    <div id="homecard"></div>
    <div id="racebtns" class="hidden">
      <button id="nitrobtn" class="btn nitro">NITRO</button>
      <button class="btn small off" data-act="quitrace" style="pointer-events:auto">✖ QUITTER</button>
    </div>
    <div id="result" class="hidden"></div>
  </div>
  <section id="panel" class="hidden"></section>
</div>
<script src="js/data.js"></script>
<script src="js/physics.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/race.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
