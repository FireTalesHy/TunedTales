<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuned Tales – Drag & Tuning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&family=Teko:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1.6.1">
</head>
<body>
<div id="app">
  <header id="topbar"><span id="logo">TUNED<i>TALES</i></span><span id="carname"></span><span class="tbr"><button id="fsbtn" class="iconbtn" data-act="fullscreen" title="Plein écran (F)">⛶</button><button id="mutebtn" class="iconbtn" data-act="mute" title="Son">🔊</button><span id="cash"></span></span></header>
  <div id="stage">
    <canvas id="scene" width="960" height="540"></canvas>
    <nav id="menu">
      <button class="mi" data-act="go" data-v="tuning"><span class="ico">📈</span><span class="txt"><b>TUNING</b><small>Pièces, courbes & gains</small></span></button>
      <button class="mi" data-act="go" data-v="body"><span class="ico">🎨</span><span class="txt"><b>CARROSSERIE</b><small>Kits, jantes, vinyles, stance</small></span></button>
      <button class="mi" data-act="go" data-v="garage"><span class="ico">🔧</span><span class="txt"><b>GARAGE</b><small>Tes voitures · swap moteur</small></span></button>
      <button class="mi" data-act="go" data-v="jobs"><span class="ico">💼</span><span class="txt"><b>PETITS BOULOTS</b><small>Mini-jeux · arrondis tes fins de mois</small></span></button>
      <button class="mi" data-act="go" data-v="shop"><span class="ico">🚗</span><span class="txt"><b>CONCESSION</b><small>Achète une nouvelle caisse</small></span></button>
    </nav>
    <div id="homecard"></div>
    <button id="racego" data-act="go" data-v="races"><span class="rg-flag" aria-hidden="true"></span><span class="rg-txt"><small>DRAG 402 m · CONTRATS · TITRES</small><b>COURSES</b></span><span class="rg-arrow" aria-hidden="true">▶</span></button>
    <div id="racebtns" class="hidden">
      <button id="nitrobtn" class="btn nitro">NITRO</button>
      <button class="btn small off" data-act="quitrace" style="pointer-events:auto">✖ QUITTER</button>
    </div>
    <div id="result" class="hidden"></div>
  </div>
  <section id="panel" class="hidden"></section>
</div>
<script src="js/data.js?v=1.6.1"></script>
<script src="js/physics.js?v=1.6.1"></script>
<script src="js/sprites.js?v=1.6.1"></script>
<script src="js/audio.js?v=1.6.1"></script>
<script src="js/game.js?v=1.6.1"></script>
<script src="js/race.js?v=1.6.1"></script>
<script src="js/jobs.js?v=1.6.1"></script>
<script src="js/ui.js?v=1.6.1"></script>
<script src="js/main.js?v=1.6.1"></script>
</body>
</html>
